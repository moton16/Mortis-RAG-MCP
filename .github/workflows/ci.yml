name: CI

on:
  # push 只在 main 与 ci/** 上触发。本仓库同时是上游本体，宽触发（["**"]）合入后
  # 会对任意分支 push 永久生效，且同仓分支 PR 会 push + pull_request 双跑全部 job。
  # feature 分支已由 pull_request 事件覆盖，不需要 push 触发。
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Force UTF-8 for the runner and every child process: the test suite pipes
    # Chinese content through stdio, which dies on the default cp1252 locale
    # of Windows runners (and on POSIX runners with a C locale).
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows-only coverage: the native watcher (ReadDirectoryChangesW)
          # and its integration tests are skipped on every other platform.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (zero runtime deps)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest
          python -m pip install -e .

      - name: Show environment
        run: |
          python -c "import sys, sqlite3; print(sys.version); print('sqlite', sqlite3.sqlite_version)"
          python -m pip list

      - name: Run tests
        shell: pwsh
        run: |
          $run = Join-Path $pwd ".runtime/ci/core/$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path "$run/temp" -Force | Out-Null
          $env:TEMP = "$run/temp"; $env:TMP = "$run/temp"; $env:TMPDIR = "$run/temp"
          $env:MORTIS_RAG_NO_STATUS_HOOK = "1"
          python -B -m pytest -q --durations=15 "--basetemp=$run/pytest" -o "cache_dir=$run/cache"
          exit $LASTEXITCODE

  extras:
    name: required docs/media/vec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      MORTIS_REQUIRE_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required extras
        run: python -m pip install pytest -e ".[docs,media,vec]"
      - name: Positive dependency and backend checks
        shell: pwsh
        run: |
          python -c "import pymupdf, pypdf, docx, pptx, openpyxl, PIL, sqlite_vec"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $run = Join-Path $pwd ".runtime/ci/extras/$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path "$run/temp" -Force | Out-Null
          $env:TEMP = "$run/temp"; $env:TMP = "$run/temp"; $env:TMPDIR = "$run/temp"
          $env:MORTIS_RAG_NO_STATUS_HOOK = "1"
          python -B -m pytest -q tests/test_extra_formats.py tests/test_vector_backend.py "--basetemp=$run/pytest" -o "cache_dir=$run/cache"
          exit $LASTEXITCODE
