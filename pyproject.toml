[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mortis-rag-mcp"
version = "0.4.1"
description = "Mortis'RAG MCP - registry-based Markdown knowledge base RAG server (MCP over stdio, zero runtime dependencies)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Optional disk-backed vector storage (sqlite-vec). Not required for core use;
# enables [vector] backend = "sqlite_vec" to keep embeddings off RAM.
vec = ["sqlite-vec>=0.1.9"]

[project.scripts]
mortis-rag-mcp = "vault_mcp.__main__:main"
vault-mcp = "vault_mcp.__main__:main"  # legacy alias kept for existing connectors

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vault_mcp*"]
