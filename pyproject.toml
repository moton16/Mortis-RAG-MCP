[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mortis-rag-mcp"
version = "0.3.0"
description = "Mortis'RAG MCP - registry-based Markdown knowledge base RAG server (MCP over stdio, zero runtime dependencies)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mortis-rag-mcp = "vault_mcp.__main__:main"
vault-mcp = "vault_mcp.__main__:main"  # legacy alias kept for existing connectors

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vault_mcp*"]
