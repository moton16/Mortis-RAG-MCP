[build-system]
# setuptools>=77 is required for the PEP 639 SPDX license fields below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mortis-rag-mcp"
version = "0.9.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Mortis'RAG MCP - registry-based Markdown knowledge base RAG server (MCP over stdio, zero runtime dependencies)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Optional disk-backed vector storage (sqlite-vec). Not required for core use;
# enables [vector] backend = "sqlite_vec" to keep embeddings off RAM.
vec = ["sqlite-vec>=0.1.9"]
# Optional numeric acceleration: batched cosine in _indexer/search.py
# (semantic_rank). Soft dependency — without numpy the code falls back to the
# scalar loop automatically; never required for correctness.
accel = ["numpy>=1.24"]
# PyMuPDF has AGPL/commercial distribution terms; this extra is not all MIT.
docs = ["pymupdf>=1.24,<2", "pypdf>=4,<7", "python-docx>=1.0,<2", "python-pptx>=1.0,<2", "openpyxl>=3.1,<4"]
media = ["Pillow>=10,<13"]

[project.scripts]
mortis-rag-mcp = "mortis_rag_mcp.__main__:main"
vault-mcp = "mortis_rag_mcp.__main__:main"  # legacy alias kept for existing connectors

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not slow and not real_carrier"'
markers = [
    "slow: full production sync/proxy/link integration; select with -o addopts= -m slow",
    "real_carrier: distinct real embedding-carrier contracts; select with -o addopts= -m real_carrier",
]

[tool.setuptools.packages.find]
include = ["mortis_rag_mcp*"]
